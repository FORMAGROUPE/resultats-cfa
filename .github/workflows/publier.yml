name: Publication des résultats CFA

on:
  # Déclenchement immédiat depuis Notion (via n8n) ou à la main depuis l'onglet Actions
  workflow_dispatch:
  # Filet de sécurité : relecture de Notion toutes les heures
  schedule:
    - cron: "17 * * * *"
  # Republication à chaque modification du code de la page
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Plusieurs modifications rapprochées dans Notion = une seule publication (la dernière)
concurrency:
  group: publication
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lecture de la base Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          NOTION_DATABASE_ID_NON_DIPLOMANTES: ${{ vars.NOTION_DATABASE_ID_NON_DIPLOMANTES }}
        run: node scripts/fetch-notion.mjs
      - name: Génération de la page
        run: node scripts/build.mjs data/resultats.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
